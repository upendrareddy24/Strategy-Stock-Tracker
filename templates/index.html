<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Strategy Tracker Pro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-primary: #c9d1d9;
            --text-secondary: #8b949e;
            --accent-blue: #58a6ff;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-purple: #bc8cff;
            --accent-orange: #ffab00;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
        }

        .dashboard {
            max-width: 1600px;
            margin: 0 auto;
            padding: 30px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        h1 {
            font-size: 2.5rem;
            margin: 0;
            background: linear-gradient(90deg, #fff, #8b949e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .controls {
            display: flex;
            gap: 15px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Outfit', sans-serif;
        }

        .btn-primary {
            background-color: var(--accent-blue);
            color: white;
            border: none;
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: rgba(248, 81, 73, 0.1);
            color: var(--accent-red);
            border-color: var(--accent-red);
        }

        .btn-danger:hover {
            background: var(--accent-red);
            color: white;
        }

        .strategy-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        .strategy-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .strategy-card:hover {
            border-color: #58a6ff66;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .strategy-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .strategy-title-container {
            flex: 1;
        }

        .strategy-name {
            font-size: 1.25rem;
            font-weight: 700;
            color: white;
            display: block;
            margin-bottom: 4px;
            border: 1px solid transparent;
            padding: 2px 4px;
            border-radius: 4px;
            cursor: pointer;
        }

        .strategy-name:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--border-color);
        }

        .strategy-name:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--accent-blue);
        }

        .strategy-badge {
            font-size: 0.7rem;
            text-transform: uppercase;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 700;
        }

        .stock-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .stock-ticker {
            font-weight: 700;
            font-size: 1.1rem;
            color: white;
        }

        .roi-positive {
            color: var(--accent-green);
        }

        .roi-negative {
            color: var(--accent-red);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 16px;
            width: 400px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
            font-family: inherit;
        }

        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 17, 23, 0.9);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
    </style>
</head>

<body>
    <div class="dashboard">
        <header>
            <div>
                <h1>Strategy Tracker</h1>
                <p style="color: var(--text-secondary); margin-top: 5px;">Pro-Grade Institutional Review Wizard</p>
            </div>
            <div class="controls">
                <button class="btn" style="background: rgba(88, 166, 255, 0.1); color: var(--accent-blue);"
                    onclick="exportData()">
                    <i class="fas fa-file-excel"></i> 30-Day Export
                </button>
                <button class="btn btn-danger" onclick="clearAll()">
                    <i class="fas fa-trash-alt"></i> Clear All
                </button>
                <button class="btn" style="background: #30363d; color: white;" onclick="updatePrices()">
                    <i class="fas fa-sync-alt"></i> Update Prices
                </button>
                <button class="btn btn-primary" onclick="openAddModal()">
                    <i class="fas fa-plus"></i> Add Stock
                </button>
            </div>
        </header>

        <div class="strategy-grid" id="strategyGrid">
            <!-- Dynamic Strategy Cards will be injected here -->
        </div>
    </div>

    <!-- Modals -->
    <div id="addModal" class="modal">
        <div class="modal-content">
            <h2>Add New Stock</h2>
            <div class="form-group">
                <label>Ticker Symbol</label>
                <input type="text" id="tickerInput" placeholder="AAPL, TSLA, etc.">
            </div>
            <div class="form-group">
                <label>Strategy</label>
                <select id="strategySelect">
                    <!-- Dynamic Options -->
                </select>
            </div>
            <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 10px;">
                <button class="btn" style="background: transparent; color: var(--text-secondary);"
                    onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="addStock()">Add Stock</button>
            </div>
        </div>
    </div>

    <input type="file" id="fileUpload" style="display: none;" onchange="handleFileUpload(this)">

    <div id="loading" class="loading-overlay">
        <div style="text-align: center;">
            <i class="fas fa-circle-notch fa-spin fa-3x" style="margin-bottom: 15px; color: var(--accent-blue);"></i>
            <p id="loadingText" style="font-weight: 600;">Processing...</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sparklines/2.1.2/jquery.sparkline.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <div
        style="position: fixed; bottom: 5px; right: 5px; color: #555; font-size: 0.7rem; font-family: sans-serif; opacity: 0.7;">
        v2.0 • Auto-Targets Active</div>
</body>

</html>
